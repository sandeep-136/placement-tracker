<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Tracker</title>
<link rel="stylesheet" href="/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▚</span>
    <div>
      <h1>Placement Tracker</h1>
      <p class="tagline">Every application, one pipeline</p>
    </div>
  </div>
  <div class="topbar-actions">
    <input id="search" type="search" placeholder="Search company, role, location..." autocomplete="off">
    <button id="add-btn" class="btn-primary">+ Add application</button>
  </div>
</header>

<section id="stats" class="stats"></section>

<main id="board" class="board" aria-live="polite"></main>

<div id="modal" class="modal-backdrop hidden">
  <form id="app-form" class="modal">
    <h2 id="modal-title">Add application</h2>
    <div class="grid">
      <label>Company *<input name="company" required maxlength="200"></label>
      <label>Role *<input name="role" required maxlength="200"></label>
      <label>Location<input name="location" maxlength="200" placeholder="Remote, Bengaluru..."></label>
      <label>Source<input name="source" maxlength="100" placeholder="Internshala, LinkedIn..."></label>
      <label>Stipend<input name="stipend" maxlength="100" placeholder="Rs 8,000/month"></label>
      <label>Stage
        <select name="status">
          <option value="applied">Applied</option>
          <option value="assessment">Assessment</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <label>Applied on<input name="applied_date" type="date"></label>
      <label>Deadline<input name="deadline" type="date"></label>
      <label class="wide">Posting URL<input name="url" type="url" maxlength="500" placeholder="https://..."></label>
      <label class="wide">Notes<textarea name="notes" rows="3" maxlength="5000"></textarea></label>
    </div>
    <p id="form-error" class="form-error"></p>
    <div class="modal-actions">
      <button type="button" id="cancel-btn" class="btn-ghost">Cancel</button>
      <button type="submit" class="btn-primary">Save</button>
    </div>
  </form>
</div>

<footer class="footer">A project by Sandeep Sagar · demo data is fictional and resets on redeploy</footer>
<script src="/app.js"></script>
</body>
</html>
